spring.application.name=teacher-feedback-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/teacher_feedback?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:teacher_app}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.time-zone=Asia/Shanghai

logging.file.name=${LOG_FILE:logs/teacher-feedback-api.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level trace_id=%X{traceId:-none} [%thread] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level trace_id=%X{traceId:-none} [%thread] %logger{36} - %msg%n

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
spring.servlet.multipart.file-size-threshold=10MB

ai.aliyun-ocr.endpoint=${ALIYUN_OCR_ENDPOINT:https://gjbsb.market.alicloudapi.com/ocrservice/advanced}
ai.aliyun-ocr.app-code=${ALIYUN_OCR_APPCODE:}
ai.aliyun-ocr.image-field=${ALIYUN_OCR_IMAGE_FIELD:img}

ai.model.provider=${AI_MODEL_PROVIDER:direct}
ai.model.base-url=${AI_MODEL_BASE_URL:${DEEPSEEK_BASE_URL:https://api.deepseek.com}}
ai.model.api-key=${AI_MODEL_API_KEY:${DEEPSEEK_API_KEY:}}
ai.model.primary=${AI_MODEL_PRIMARY:${DEEPSEEK_MODEL:deepseek-v4-flash}}
ai.model.fallback=${AI_MODEL_FALLBACK:}

services.asr.base-url=${ASR_BASE_URL:http://127.0.0.1:8090}
services.asr.service-token=${ASR_SERVICE_TOKEN:}
services.asr.timeout-seconds=${ASR_TIMEOUT_SECONDS:45}
services.asr.dialogue-timeout-seconds=${ASR_DIALOGUE_TIMEOUT_SECONDS:300}
services.asr.audio-temp-dir=${ASR_AUDIO_TEMP_DIR:data/lesson-audio}

admin.access-token=${ADMIN_ACCESS_TOKEN}

# 小程序微信登录配置；AppSecret 只能放在后端环境变量，不能提交到前端或仓库。
auth.wechat.app-id=${WECHAT_APP_ID:}
auth.wechat.app-secret=${WECHAT_APP_SECRET:}
# 微信换码请求不能无限等待；生产环境可按网络情况调整，但不要删除超时。
auth.wechat.connect-timeout-ms=${WECHAT_CONNECT_TIMEOUT_MS:3000}
auth.wechat.read-timeout-ms=${WECHAT_READ_TIMEOUT_MS:8000}
auth.session-ttl-hours=${WECHAT_SESSION_TTL_HOURS:168}
# 默认拒绝未登录业务请求；本地启动脚本会显式注入 false 供单老师联调。
auth.require-teacher-token=${AUTH_REQUIRE_TEACHER_TOKEN:true}
auth.default-teacher-id=${AUTH_DEFAULT_TEACHER_ID:1}
